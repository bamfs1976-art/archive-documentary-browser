[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://archive.org https://*.archive.org data:; connect-src https://archive.org https://query.wikidata.org; frame-src https://archive.org; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
